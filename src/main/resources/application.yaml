spring:
  application:
    name: Apemigos-Backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  liquibase:
    changeLog: classpath:db/db.changelog-master.yml

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
      pool-name: HikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        temp:
          use_jdbc_metadata_defaults: false
        connection:
          provider_disables_autocommit: false

  # Mail properties read from environment variables (override via .env or env)
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    protocol: ${SPRING_MAIL_PROTOCOL:smtp}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          # starttls.enable faz upgrade para TLS na porta 587 — controlado via env
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:true}
          # connection & socket timeouts (ms)
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:10000}
          timeout: ${SPRING_MAIL_TIMEOUT:10000}
          writetimeout: ${SPRING_MAIL_WRITETIMEOUT:10000}
        # enable SSL (SMTPS/implicit TLS) when requested (porta 465)
        ssl:
          enable: ${SPRING_MAIL_SSL_ENABLE:false}
          trust: ${SPRING_MAIL_HOST}
        # Optional socketFactory config (works with some providers)
        socketFactory:
          port: ${SPRING_MAIL_PORT}
          class: ${SPRING_MAIL_SOCKETFACTORY_CLASS:javax.net.ssl.SSLSocketFactory}
        # debug
        debug: ${SPRING_MAIL_DEBUG:false}

# Tempo que o Spring aguarda por fases de shutdown (maior valor para permitir uploads finais)
spring.lifecycle:
  timeout-per-shutdown-phase: 5m

jwt:
  secret: ${JWT_SECRET:mySuperSecretKeyForJWTGeneration2024ApemigosProjectSecureKeyWithMinimum64CharactersLengthNow123!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}           # 24 horas padrão
  service-expiration-ms: ${JWT_SERVICE_EXPIRATION_MS:3600000}  # 1 hora padrão
  service-key: ${JWT_SERVICE_KEY:apemigos-service-key-2024-secure-version}
  issuer: ${JWT_ISSUER:apemigos-auth-server}
  token-prefix: "Bearer "
  header: "Authorization"

# Segurança: lista de IPs permitidos. Por padrão usa '*' (aceita todos) quando a variável
# de ambiente IPS_PERMITIDOS não for definida. Em produção recomenda-se setar IPS_PERMITIDOS
# explicitamente (ex.: IPS_PERMITIDOS=10.0.0.0/8,203.0.113.5)
security:
  allowed:
    ips: ${IPS_PERMITIDOS:*}

logging:
  level:
    org.apemigos.auth.service: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    csrf:
      enabled: true
    show-extensions: true
    show-common-extensions: true
    urls:
      - url: /v3/api-docs
        name: API Apemigos
  api-docs:
    path: /v3/api-docs
    groups:
      enabled: true
  show-actuator: true
  writer-with-default-pretty-printer: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match:
    - /api/**

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  # Habilita shutdown gracioso (Spring Boot 2.3+)
  shutdown: graceful
  # Important: when behind proxies (Railway, Heroku, nginx) enable forwarding so app sees
  # the original client IP and scheme (X-Forwarded-For, X-Forwarded-Proto)
  forward-headers-strategy: framework

integracao:
  cloudinary:
    url: ${CLOUDINARY_URL}

default:
  email:
    to: ${DEFAULT_EMAIL_TO}

pix:
  default:
    key: ${PIX_KEY}
    merchant-name: ${PIX_MERCHANT_NAME}
    merchant-city: ${PIX_MERCHANT_CITY}
